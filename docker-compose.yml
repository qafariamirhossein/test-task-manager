version: '3.9'

services:
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    environment:
      - MONGO_URL=mongodb://mongodb:27017/tasks
    depends_on:
      - mongodb
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
    environment:
      - NUXT_PUBLIC_BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    ports:
      - '3001:3001'

volumes:
  mongo-data:
