services:
  backend:
    build:
      context: ./backend
    environment:
      - MONGO_URL=${MONGO_URL:-mongodb://localhost:27017/tasks}
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
    environment:
      - NUXT_PUBLIC_BACKEND_URL=${NUXT_PUBLIC_BACKEND_URL:-http://backend:3000}
    depends_on:
      - backend
    ports:
      - '3001:3001'

